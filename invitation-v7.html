<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>SOULSCRIPT — L'Invitation aux Archives</title>

<!--
═══════════════════════════════════════════════════════════════
  SOULSCRIPT — L'INVITATION AUX ARCHIVES — V7
═══════════════════════════════════════════════════════════════

  DÉROULEMENT :
  1. Lien personnel : invitation-v7.html?d=0017&t=JETON
  2. Écran 1 : enveloppe scellée (poster). Toucher le sceau.
  3. Écran 2 : la vidéo joue toute la séquence rituelle.
  4. Écran 3 : fondu vers le LIVRE SOULSCRIPT (image intacte).
     - Le nom + le dossier du client s'inscrivent en bas du livre,
       à la place de « VOTRE DOSSIER VOUS ATTEND / DEPUIS TOUJOURS ».
     - Une zone cliquable invisible est posée sur le bouton OUVRIR
       déjà dessiné dans l'image → mène aux Archives du client.

  L'IMAGE DU LIVRE N'EST JAMAIS MODIFIÉE. Seuls deux calques HTML
  sont superposés : l'identité (bas) et la zone cliquable (OUVRIR).

  FICHIERS REQUIS (même dossier) :
  - invitation-v7.html
  - invitation-archives-v2.mp4   (vidéo rituelle)
  - enveloppe-poster-v2.jpg      (poster de départ)
  - livre-soulscript.jpg         (le Livre, image finale)
  - netlify/functions/convocation.js  (inchangé)

  RÈGLES : aucun scroll-trigger. gardien.js / natal-chart.js
  jamais touchés. Image du livre jamais retouchée.
═══════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

<style>
:root{
  --noir-mineral:#060402;
  --noir-profond:#0B0805;
  --bronze:#C89B5B;
  --or-clair:#E8CC7A;
  --or-lumiere:#F5E3B3;
  --police-titres:'Cinzel', Georgia, serif;
  --police-corps:'Cormorant Garamond', Georgia, serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  background:var(--noir-mineral);
  overflow:hidden;
  font-family:var(--police-corps);
  -webkit-tap-highlight-color:transparent;
}

.scene{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--noir-mineral);
}

.ecran{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:1;
}
.ecran.masque{opacity:0;pointer-events:none;}
#ecranEnveloppe{transition:opacity 1.5s ease;}
#ecranLivre{transition:opacity 1.5s ease;}

/* ═══════════ ENVELOPPE + VIDÉO ═══════════ */
.video-enveloppe{
  width:100%;
  height:100%;
  object-fit:contain;
  background:var(--noir-mineral);
}
.invite-toucher{
  position:absolute;
  bottom:6%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:var(--or-clair);
  font-family:var(--police-titres);
  font-size:0.72rem;
  letter-spacing:0.32em;
  text-transform:uppercase;
  opacity:0.85;
  animation:respiration 3.2s ease-in-out infinite;
  pointer-events:none;
  text-shadow:0 0 18px rgba(200,155,91,0.55);
  transition:opacity 0.8s ease;
}
.invite-toucher.masque{opacity:0;}
@keyframes respiration{
  0%,100%{opacity:0.45;}
  50%{opacity:0.95;}
}

/* ═══════════ ÉCRAN 3 : LE LIVRE ═══════════ */
#ecranLivre{
  background:var(--noir-mineral);
  overflow:hidden;
}

/* Conteneur au ratio EXACT de l'image (1122×1402).
   La largeur est le min entre l'écran et ce que la hauteur permet :
   la scène épouse ainsi exactement l'image rendue, et les calques
   positionnés en % tombent précisément sur le livre. */
.livre-scene{
  position:relative;
  width:min(100vw, calc(min(100vh, 100svh) * 1122 / 1402));
  aspect-ratio:1122 / 1402;
  margin:auto;
}
.livre-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill; /* la scène a déjà le bon ratio : aucun étirement réel */
  user-select:none;
  -webkit-user-drag:none;
  z-index:1;
}

/* ── ZONE CLIQUABLE INVISIBLE sur le bouton OUVRIR dessiné ──
   Recalibrée d'après test réel sur mobile (Oppo) : la zone
   précédente (79%-84.2%) tombait au-dessus du vrai cartouche.
   Nouvelle position vérifiée par analyse de gradient sur l'image
   source : bordure basse du cadre confirmée entre 84.4% et 87%. */
.livre-ouvrir{
  position:absolute;
  top:83.5%;
  left:34%;
  right:34%;
  height:7.3%;
  display:block;
  background:transparent;
  border-radius:4px;
  z-index:10;
  pointer-events:auto;
  cursor:pointer;
  -webkit-tap-highlight-color:rgba(232,204,122,0.2);
}
.livre-ouvrir:active{
  background:rgba(232,204,122,0.1);
  box-shadow:0 0 26px rgba(232,204,122,0.22);
}

/* ── IDENTITÉ : LE NOM, GRAVÉ SUR LE CUIR ──
   Le texte original a été effacé par reconstruction de texture
   (clonage de cuir propre, sans IA générative) directement dans
   l'image livre-soulscript.jpg. Aucun voile ici : le nom s'écrit
   à même le cuir, contenu dans le cadre intérieur, marges symétriques. */
.livre-identite{
  position:absolute;
  top:93.2%;
  left:12%;
  right:12%;
  text-align:center;
  pointer-events:none;
  z-index:5;
  --u: min(calc(100vw * 1.2495), 100vh, 100svh);
}
.livre-prenom{
  font-family:var(--police-titres);
  font-size:calc(var(--u) * 0.0205);
  font-weight:600;
  letter-spacing:0.28em;
  text-indent:0.28em; /* compense l'espacement pour un centrage optique parfait */
  color:var(--or-clair);
  /* Effet gravé : léger relief doré, pas de halo flottant ni de fond */
  text-shadow:
    0 1px 0 rgba(0,0,0,0.8),
    0 0 10px rgba(200,155,91,0.45);
  line-height:1.2;
  white-space:nowrap;
  opacity:0;
  transition:opacity 2.2s ease 0.9s;
}
#ecranLivre.revelee .livre-prenom{opacity:1;}

@media (prefers-reduced-motion: reduce){
  .invite-toucher{animation:none;opacity:0.85;}
  .ecran, .livre-prenom{transition:none;}
}
</style>
</head>
<body>

<div class="scene">

  <!-- ══ ENVELOPPE + VIDÉO ══ -->
  <div class="ecran" id="ecranEnveloppe">
    <video id="videoEnveloppe"
           class="video-enveloppe"
           src="invitation-archives-v2.mp4"
           poster="enveloppe-poster-v2.jpg"
           preload="auto"
           playsinline
           webkit-playsinline></video>
    <div class="invite-toucher" id="inviteToucher">Touchez le sceau</div>
  </div>

  <!-- ══ ÉCRAN 3 : LE LIVRE SOULSCRIPT ══ -->
  <div class="ecran masque" id="ecranLivre">
    <div class="livre-scene">
      <!-- Image du Livre : jamais modifiée -->
      <img class="livre-image" src="livre-soulscript.jpg" alt="SOULSCRIPT — Archives de l'Âme" draggable="false">

      <!-- Identité : le nom, gravé sur le cuir nettoyé -->
      <div class="livre-identite">
        <div class="livre-prenom" id="prenomClient">&nbsp;</div>
      </div>

      <!-- Zone cliquable invisible sur le bouton OUVRIR dessiné -->
      <a class="livre-ouvrir" id="boutonArchives" href="#" aria-label="Ouvrir mes Archives"></a>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   LOGIQUE — V7. Aucune dépendance. Aucun scroll-trigger.
   La chaîne de données (convocation.js + jeton) est inchangée.
   ═══════════════════════════════════════════════════════════ */

const CONFIG = {
  urlFonction: '/.netlify/functions/convocation',
  demo: { prenom: 'ANISSA SAKOUHI', dossier: '0017', url: '#' }
};

const video     = document.getElementById('videoEnveloppe');
const ecranEnv  = document.getElementById('ecranEnveloppe');
const ecranLivre= document.getElementById('ecranLivre');
const invite    = document.getElementById('inviteToucher');
const elPrenom  = document.getElementById('prenomClient');
const elBouton  = document.getElementById('boutonArchives');

let donneesClient = { ...CONFIG.demo };
let rituelLance = false;

/* ── 1. Charger les données client dès l'arrivée ── */
(async function chargerDonnees(){
  const params  = new URLSearchParams(window.location.search);
  const dossier = params.get('d');
  const jeton   = params.get('t');

  if(!dossier || !jeton){
    console.warn('SOULSCRIPT : paramètres absents — mode démonstration.');
    remplirLivre();
    return;
  }
  try{
    const reponse = await fetch(
      CONFIG.urlFonction + '?d=' + encodeURIComponent(dossier) +
      '&t=' + encodeURIComponent(jeton)
    );
    if(!reponse.ok) throw new Error('Jeton invalide ou dossier inconnu');
    const data = await reponse.json();
    donneesClient = {
      prenom : (data.prenom  || CONFIG.demo.prenom).toUpperCase(),
      dossier: data.dossier || CONFIG.demo.dossier,
      url    : data.url     || CONFIG.demo.url
    };
  }catch(erreur){
    console.warn('SOULSCRIPT : ' + erreur.message + ' — mode démonstration.');
  }
  remplirLivre();
})();

function remplirLivre(){
  elPrenom.textContent = donneesClient.prenom;
  elBouton.href        = donneesClient.url;
}

/* ── SÉCURITÉ NAVIGATION : gestionnaire de clic explicite ──
   En complément du href (qui suffit normalement), un handler
   direct garantit la navigation même si un contexte tactile
   mobile particulier interceptait le comportement natif du lien. */
elBouton.addEventListener('click', function(e){
  e.preventDefault();
  window.location.href = donneesClient.url;
});

/* ── 2. Toucher le sceau → lecture de la vidéo ── */
ecranEnv.addEventListener('click', function(){
  if(rituelLance) return;
  rituelLance = true;
  invite.classList.add('masque');
  video.play().catch(function(){ revelerLivre(); });
});

/* ── 3. Fin de la vidéo → maintien de la dernière image (révélation),
   puis fondu croisé lent vers le Livre. La vidéo reste affichée sur
   sa dernière frame pendant le maintien (comportement natif du
   navigateur en fin de lecture : pas d'écran noir). ── */
video.addEventListener('ended', function(){
  setTimeout(revelerLivre, 5000); // maintien : 5s pour lire la révélation
});

function revelerLivre(){
  ecranEnv.classList.add('masque');
  ecranLivre.classList.remove('masque');
  requestAnimationFrame(function(){
    ecranLivre.classList.add('revelee');
  });
}
</script>

</body>
</html>
