<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050403">
<title>SOULSCRIPT — Le Sceau de Transformation</title>
<style>
:root{--void:#050403;--gold:#b9904e;--gold-light:#e2c98e;--ivory:#efe7d2;--muted:rgba(239,231,210,.68)}
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:var(--void);color:var(--ivory);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}body{display:grid;place-items:center}.page{position:relative;width:100%;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:40px 22px 48px;isolation:isolate;background:radial-gradient(circle at 50% 42%,rgba(137,91,27,.13),transparent 38%),radial-gradient(circle at 50% 100%,rgba(185,144,78,.07),transparent 35%),#050403}.page:before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.68)),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px)}.page:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.95)}.ritual{width:min(820px,100%);text-align:center;opacity:0;transform:translateY(12px);animation:reveal 1.6s ease-out .3s forwards}.eyebrow{margin:0 0 16px;color:var(--gold);font-size:clamp(.72rem,2.2vw,.88rem);letter-spacing:.32em;text-transform:uppercase}h1{margin:0 auto 22px;max-width:700px;color:var(--gold-light);font-weight:400;font-size:clamp(1.75rem,6vw,3.5rem);line-height:1.08;letter-spacing:.06em;text-transform:uppercase}.intro{width:min(680px,100%);margin:0 auto 22px;font-size:clamp(1rem,3.1vw,1.25rem);line-height:1.72;color:var(--ivory)}.intro strong{color:var(--gold-light);font-weight:500}.seal{position:relative;width:min(520px,94vw);margin:18px auto 20px;aspect-ratio:1/1;display:grid;place-items:center}.seal:before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(211,155,61,.15),transparent 68%);filter:blur(18px);animation:breathe 5s ease-in-out infinite}video{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 22px rgba(210,153,63,.15)) contrast(1.04) saturate(.92)}.closing{width:min(650px,100%);margin:0 auto;color:var(--muted);font-style:italic;font-size:clamp(.98rem,2.9vw,1.18rem);line-height:1.7}.final{margin-top:24px;color:var(--gold);font-size:clamp(.72rem,2vw,.85rem);letter-spacing:.26em;text-transform:uppercase}.sound{position:fixed;right:16px;bottom:16px;z-index:10;border:1px solid rgba(185,144,78,.45);border-radius:999px;padding:10px 13px;background:rgba(5,4,3,.74);color:var(--gold-light);font:inherit;font-size:.78rem;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(7px)}@keyframes reveal{to{opacity:1;transform:translateY(0)}}@keyframes breathe{0%,100%{transform:scale(.97);opacity:.45}50%{transform:scale(1.04);opacity:.9}}@media(max-width:600px){.page{padding-top:28px;padding-bottom:70px}.intro{line-height:1.55}.seal{margin-top:8px;margin-bottom:10px}}@media(prefers-reduced-motion:reduce){.ritual,.seal:before{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<main class="page"><section class="ritual" aria-label="Sceau de transformation SOULSCRIPT"><p class="eyebrow">SOULSCRIPT</p><p class="intro">Vous êtes entrée dans les Archives pour comprendre qui vous étiez.<br><br>Les Archives ont accompli leur part.<br><br><strong>Vous en sortez avec la responsabilité de choisir qui vous deviendrez.</strong></p><div class="seal"><video id="phoenix" autoplay muted loop playsinline preload="auto" aria-label="Le Phénix d’Obsidienne s’active"><source src="phoenix.mp4" type="video/mp4">Votre navigateur ne prend pas en charge la vidéo.</video></div><p class="closing">Certaines vérités éclairent.<br>D’autres consument ce qui ne peut plus rester.</p><p class="final">Les Archives se referment ici.</p></section></main>
<button class="sound" id="soundButton" type="button" aria-pressed="false">Activer le son</button>
<script>const video=document.getElementById('phoenix');const soundButton=document.getElementById('soundButton');soundButton.addEventListener('click',async()=>{video.muted=!video.muted;soundButton.setAttribute('aria-pressed',String(!video.muted));soundButton.textContent=video.muted?'Activer le son':'Couper le son';if(video.paused){try{await video.play()}catch(e){console.warn('Lecture automatique bloquée',e)}}});</script>
</body>
</html>
